[project]
name = "micclaude"
version = "0.1.0"
description = "Browser microphone transcription that asks Claude Code when you address it by name"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.0.0", "numpy>=1.24"]

[project.scripts]
micclaude = "micclaude.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "server" }
packages = ["micclaude"]
